<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@400;700&display=swap" rel="stylesheet">

  <link rel="icon" href="./src/assets/Logo.svg">
<!--
  <link rel="stylesheet" href="./src/style/style.css">
  -->
  
  <title>Member Club</title>
<link rel="icon" href="Logo.svg"><script defer src="main.js"></script></head>
<body>  
  <header>
    <img src="./src/assets/Logo.svg" alt="Menber Club logo" class="logo">
    
    <form>  
      <input type="text" name="id do cartão" id="id" placeholder="ID do cartão">
      <button>
        <img src="./src/assets/assets/ArrowElbowDownLeftN.svg" alt="enviar">
      </button>
    </form>
  </header>
  <div class="container">
    <main>    
      <section>
        <div id="user">
          <div id="avatar">
            <img src="./src/assets/Avatar.png" alt="Avatar">
          </div>
          <div id="user-info">
            <h1>Natália Miranda</h1>
            <p>Cliente desde 18/09/2023</p>
          </div>        
        </div>
        <div id="history">
          <div id="history-header">
            <h2>HISTÓRICO</h2>
            <p id="history-p">7 cortes</p>
          </div>
          
          <hr>
          <div id="list">
            <ul id="haircuts">
              <li id="haircut">
                <div id="date">
                  <span id="day">01/01/1991</span>
                  <span id="hour">11:00</span>
                </div>
                <img
                  src="./src/assets/assets/IconN.svg"
                  alt="Marcação de corte"
                  class="pin-check-incon">
              </li>
              <li id="haircut">
                <div id="date">
                  <span id="day">29/04/2024</span>
                  <span id="hour">18:30</span>
                </div>
                <img
                  src="./src/assets/assets/IconN.svg"
                  alt="Marcação de corte"
                  class="pin-check-incon">
              </li>
              
            </ul>
          </div>
        </div>
      </section>
      <section>      
        <div id="card">
          <div id="card-header">
            <span>
              <h2>Cartão fidelidade</h2>
              <p>Ao fazer cortes de cabelo, o décimo sai de graça!</p>
            </span>
            <span id="user-id">ID: 124-537-835-230</span>
          </div>
          <div id="seals">
            <div class="seal"><img src="./src/assets/assets/PinCheckN.svg" alt="Selo fidelidade"></div>
            <div class="seal"><img src="./src/assets/assets/PinCheckN.svg" alt="Selo fidelidade"></div>
            <div class="seal"></div>
            <div class="seal"></div>
            <div class="seal"><img src="./src/assets/assets/PinCheckN.svg" alt="Selo fidelidade"></div>
            <div class="seal"><img src="./src/assets/assets/PinCheckN.svg" alt="Selo fidelidade"></div>
            <div class="seal"></div>
            <div class="seal"></div>
            <div class="seal"></div>
            <div class="seal"><img src="./src/assets/assets/PinGiftGrayN.svg" alt="Selo presente"></div>
          </div>
       </div>
        <div id="progress">
          <div id="progress-info">
            <div id="info-cuts">
              <span>3</span>
              <p>cortes restantes</p>
            </div>
            <div id="teste">
              
              <div id="bar">
                <div id="progress-bar"></div>
              </div>
              <div id="text-bar">
                <p>
                  7 de 10
                </p>
              </div>            
            </div>
            
          </div>
          <img src="./src/assets/assets/PinGiftN.svg" alt="selo presente">
        </div>
      </section>
    </main>
  </div>
</body>
</html>
